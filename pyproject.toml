[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboecc"
version = "0.1.0"
description = "Core planning utilities for RoboECC edge-cloud VLA deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
lstm = ["torch>=2.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
roboecc-search = "roboecc.cli:main"
roboecc-train-bandwidth = "roboecc.train_bandwidth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
